name: 日刊ロジック100円文庫 — 毎日発行

# 「1日1本、勝手に出し続ける」自動運転の心臓部。
#  毎朝、その日の100円noteを生成し、リポジトリのアーカイブへコミットする。
#  （任意）note.com への自動投稿ジョブも opt-in で用意している。

on:
  schedule:
    # 22:00 UTC = 翌 07:00 JST（毎朝7時に発行）
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '発行する日付 (YYYY-MM-DD、空なら今日JST)'
        required: false
        default: ''

concurrency:
  group: daily-note
  cancel-in-progress: false

jobs:
  # 1) 記事を生成して、リポジトリにアーカイブとしてコミット（外部依存なし・常に動く）
  build-and-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      date: ${{ steps.build.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 今日の号を生成してアーカイブ
        id: build
        working-directory: note-factory
        run: |
          set -e
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Tokyo date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          node src/cli.js build "$DATE"
          node scripts/build-index.js

      - name: コミット & プッシュ
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add note-factory/notes
          if git diff --cached --quiet; then
            echo "変更なし（本日分は既に発行済み）。スキップします。"
          else
            git commit -m "日刊ロジック: ${{ steps.build.outputs.date }} 号を自動発行"
            git push
          fi

  # 2) （任意）note.com へ自動投稿。既定では動かない。
  #    有効化するには、リポジトリ変数 ENABLE_NOTE_AUTOPOST を 'true' にし、
  #    シークレット NOTE_STATE_JSON（ログイン済み storageState のJSON）を登録する。
  #    ⚠️ note に公式APIは無く、ブラウザ自動操作＝ToSリスク・不安定。自己責任で。
  auto-post-to-note:
    needs: build-and-archive
    if: ${{ vars.ENABLE_NOTE_AUTOPOST == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright と Chromium を用意
        working-directory: note-factory
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: ログイン状態(state)を復元
        working-directory: note-factory
        env:
          NOTE_STATE_JSON: ${{ secrets.NOTE_STATE_JSON }}
        run: |
          if [ -z "$NOTE_STATE_JSON" ]; then
            echo "::error::NOTE_STATE_JSON シークレットが未設定です。自動投稿をスキップします。"
            exit 1
          fi
          printf '%s' "$NOTE_STATE_JSON" > src/publish/.note-state.json

      - name: note へ投稿（既定は下書き保存まで）
        working-directory: note-factory
        env:
          NOTE_AUTOMATION: '1'
          NOTE_STATE_FILE: src/publish/.note-state.json
          # 公開まで自動化したい場合のみ、リポジトリ変数 NOTE_PUBLISH を '1' に。
          NOTE_PUBLISH: ${{ vars.NOTE_PUBLISH }}
        run: |
          node src/publish/note-publisher.js post "${{ needs.build-and-archive.outputs.date }}"

      - name: スクショを成果物として保存（デバッグ用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-screenshots
          path: note-factory/src/publish/.last-post-*.png
          if-no-files-found: ignore
