<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>あそび メニュー</title>
<style>
  @font-face{font-family:"BIZ UDPGothic";font-weight:400;font-display:swap;src:url(gothic-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2074,U+20AC,U+2212;}
  @font-face{font-family:"BIZ UDPGothic";font-weight:400;font-display:swap;src:url(gothic-jp.woff2) format("woff2");}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#FBF8F1;color:#4a4a4a;
    font-family:"BIZ UDPGothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:30px 18px;}
  h1{text-align:center;font-size:clamp(30px,9vw,44px);margin:10px 0 4px;color:#333;
    text-shadow:0 2px 0 #fff,0 3px 0 #d9c9c9;}
  .sub{text-align:center;color:#7a6f6f;font-size:clamp(14px,4vw,18px);margin:0 0 26px;}
  a.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:#4a4a4a;
    background:#fff;border:4px solid #e7dede;border-radius:24px;padding:20px;margin:16px 0;
    box-shadow:0 5px 0 #e7dede;transition:transform .06s;}
  a.card:active{transform:translateY(4px);box-shadow:0 1px 0 #e7dede;}
  .ico{font-size:clamp(44px,13vw,64px);line-height:1;}
  .txt .t{font-size:clamp(22px,6.5vw,30px);font-weight:700;}
  .txt .d{font-size:clamp(13px,4vw,16px);color:#7a6f6f;margin-top:4px;}
  .c1{border-color:#f2b705;box-shadow:0 5px 0 #f2b705;}
  .c2{border-color:#3f9ec2;box-shadow:0 5px 0 #3f9ec2;}
  .c3{border-color:#3f9678;box-shadow:0 5px 0 #3f9678;}
  .c4{border-color:#6a5fc0;box-shadow:0 5px 0 #6a5fc0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>あそび メニュー</h1>
  <p class="sub">すきな あそびを えらんでね</p>

  <a class="card c1" href="make-ten.html">
    <div class="ico">🔟</div>
    <div class="txt"><div class="t">10をつくろう</div>
    <div class="d">たして 10 に なる ペアを さがそう</div></div>
  </a>

  <a class="card c2" href="kotoba-sagashi.html">
    <div class="ico">🔍</div>
    <div class="txt"><div class="t">ことばさがし</div>
    <div class="d">かくれた ことばを なぞって みつけよう</div></div>
  </a>

  <a class="card c3" href="flashcard.html">
    <div class="ico">➕</div>
    <div class="txt"><div class="t">たしざん フラッシュカード</div>
    <div class="d">10までの たしざんを れんしゅうしよう</div></div>
  </a>

  <a class="card c4" href="tarinai.html">
    <div class="ico">🧺</div>
    <div class="txt"><div class="t">たりない かずは？</div>
    <div class="d">かずを そろえるには あと いくつ？</div></div>
  </a>
</div>
</body>
</html>
