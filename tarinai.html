<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>たりない かずは なんでしょう？</title>
<style>
  @font-face{font-family:"BIZ UDPGothic";font-weight:400;font-display:swap;src:url(gothic-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2074,U+20AC,U+2212;}
  @font-face{font-family:"BIZ UDPGothic";font-weight:400;font-display:swap;src:url(gothic-jp.woff2) format("woff2");}
  :root{
    --bg:#FBF8F1; --ink:#4a4a4a; --line:#d9c9c9;
    --card:#ffffff; --card-b:#e7dede;
    --accent:#8a7ee0; --accent-d:#6a5fc0;
    --dot:#e2574f; --add:#4a92e6;
  }
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"BIZ UDPGothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;
    touch-action:manipulation;overflow-x:hidden;}
  .wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px;min-height:100vh;display:flex;flex-direction:column;}
  header{text-align:center;margin:6px 0 2px;}
  h1{font-size:clamp(22px,6.5vw,36px);margin:0;letter-spacing:.02em;color:#333;
    text-shadow:0 2px 0 #fff,0 3px 0 var(--line);}
  .subt{font-size:clamp(13px,3.8vw,17px);color:#7a6f6f;margin:6px 0 0;}
  .hidden{display:none !important;}

  .btn{font-family:inherit;font-size:clamp(16px,4.5vw,20px);font-weight:700;color:#fff;
    background:var(--accent);border:none;border-radius:16px;padding:11px 22px;cursor:pointer;
    box-shadow:0 4px 0 var(--accent-d);transition:transform .05s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d);}
  .btn.gray{background:#fff;color:#8a7f7f;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);}
  .btn.gray:active{box-shadow:0 1px 0 var(--line);}

  .screen{flex:1;display:flex;flex-direction:column;align-items:center;}
  .lead{font-size:clamp(20px,6vw,30px);font-weight:700;color:#333;text-align:center;margin:18px 0 20px;
    text-shadow:0 2px 0 #fff,0 3px 0 var(--line);}

  /* メニュー */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:600px;}
  @media(max-width:520px){ .grid{grid-template-columns:repeat(3,1fr);} }
  .tile{border-radius:18px;padding:16px 6px;text-align:center;cursor:pointer;border:3px solid;
    transition:transform .06s;box-shadow:0 5px 0 rgba(0,0,0,.06);}
  .tile:active{transform:translateY(3px);}
  .tile .tnum{font-size:clamp(30px,9vw,42px);font-weight:800;line-height:1;}
  .tile .tcnt{font-size:clamp(11px,3vw,13px);color:#6a6060;margin-top:6px;background:rgba(255,255,255,.6);
    border-radius:999px;padding:2px 8px;display:inline-block;}
  .n1{background:#ffe3e3;border-color:#f6b9b9;color:#d64545;} .n2{background:#ffe9d6;border-color:#f5cfa3;color:#d98324;}
  .n3{background:#fff6cc;border-color:#efdd8a;color:#b58a10;} .n4{background:#eef7d6;border-color:#cfe6a3;color:#7fa22a;}
  .n5{background:#e2f6d9;border-color:#b6e2a3;color:#57933a;} .n6{background:#d6f3ee;border-color:#a3e0d3;color:#2f9683;}
  .n7{background:#d7eefb;border-color:#a3d1ee;color:#2f78b3;} .n8{background:#dfe4fb;border-color:#aeb8ee;color:#4a55c0;}
  .n9{background:#ecdefb;border-color:#c9aeee;color:#7b4fc0;} .n10{background:#fbdef1;border-color:#eeaed6;color:#c0468f;}

  /* ゲーム */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:600px;flex-wrap:wrap;}
  .badge{font-size:clamp(14px,4vw,18px);font-weight:700;background:#fff;border:3px solid var(--line);
    border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 var(--line);white-space:nowrap;}
  .badge.q{color:var(--accent-d);} .badge.s{color:#d98324;border-color:#f0d9a8;box-shadow:0 3px 0 #f0d9a8;}
  .pbar{width:100%;max-width:600px;height:12px;background:#eee6e6;border-radius:8px;overflow:hidden;margin:12px 0 4px;}
  .pfill{height:100%;background:var(--accent);border-radius:8px;transition:width .3s ease;}
  .prow{width:100%;max-width:600px;display:flex;justify-content:space-between;font-size:12px;color:#8a7f7f;}

  .question{font-size:clamp(20px,5.6vw,28px);font-weight:700;text-align:center;color:#3a3a3a;
    background:#eef0ff;border:3px solid #d7d9f5;border-radius:18px;padding:14px;width:100%;max-width:600px;margin:16px 0;}
  .question b{color:var(--accent-d);font-size:1.25em;}

  /* まる（5こずつ 一続き）＋ ゴールせん */
  .framewrap{position:relative;display:inline-block;margin-top:26px;padding:0;}
  .grid5{display:grid;grid-template-columns:repeat(5,auto);gap:10px;justify-content:start;}
  .cell{width:clamp(30px,8.5vw,42px);height:clamp(30px,8.5vw,42px);border-radius:50%;
    border:2px dashed #cbb48c;background:rgba(255,255,255,.55);transition:all .15s;}
  .cell.on{border:none;background:var(--dot);}
  .cell.add{border:none;background:var(--add);animation:pop .35s both;}
  .cell.over{border:none;background:#ff8a3d;animation:pop .35s both;}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  /* ゴールせん（ここまでが もくひょう） */
  .goalline{position:absolute;width:4px;background:#3fa84a;border-radius:3px;
    box-shadow:0 0 0 2px rgba(255,255,255,.85);pointer-events:none;display:none;}
  .goalline .flag{position:absolute;top:-24px;left:50%;transform:translateX(-45%);
    font-size:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}

  .eq{font-size:clamp(26px,7.5vw,40px);font-weight:800;color:#3a3a3a;margin:18px 0 6px;text-align:center;}
  .eq .q{color:var(--accent-d);} .eq .ok{color:#3fa84a;} .eq .ng{color:#e2574f;} .eq .sel{color:#2f9e4a;}
  .eq.shake{animation:shake .5s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  .numpad{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;width:100%;max-width:520px;margin-top:8px;}
  @media(max-width:520px){ .numpad{grid-template-columns:repeat(4,1fr);} }
  .nbtn{font-family:inherit;font-size:clamp(22px,6vw,30px);font-weight:800;color:#fff;
    background:#5bb56a;border:none;border-radius:16px;padding:14px 0;cursor:pointer;
    box-shadow:0 4px 0 #439a52;transition:transform .05s;}
  .nbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #439a52;}
  .nbtn.used{opacity:.4;}
  .nbtn.bad{background:#e2574f;box-shadow:0 4px 0 #b23c35;animation:shake .4s;}
  .nbtn.sel{background:#2f9e4a;box-shadow:0 0 0 4px #ffd257,0 4px 0 #257a3b;transform:translateY(1px);}
  .numpad.lock{opacity:.45;pointer-events:none;filter:grayscale(.25);}
  .confirm{margin-top:16px;background:var(--accent);box-shadow:0 5px 0 var(--accent-d);
    font-size:clamp(18px,5vw,22px);animation:pop .3s;}
  .confirm:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d);}
  .retry{margin-top:16px;background:#ff8a3d;box-shadow:0 5px 0 #d76a20;font-size:clamp(18px,5vw,22px);animation:pop .3s;}
  .retry:active{transform:translateY(4px);box-shadow:0 1px 0 #d76a20;}

  /* まちがい の ✕（しきの よこに すっきり） */
  .eq .mark{display:inline-block;margin-left:14px;color:#e2574f;font-weight:900;
    opacity:0;transform:scale(.4);vertical-align:-2px;}
  .eq .mark.show{opacity:1;transform:scale(1);animation:pop .35s;}

  /* オーバーレイ */
  .overlay{position:absolute;inset:0;background:rgba(255,255,255,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;border-radius:22px;z-index:10;text-align:center;padding:20px;animation:fade .3s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay .big{font-size:clamp(40px,12vw,64px);}
  .overlay .ttl{font-size:clamp(26px,7vw,38px);font-weight:800;margin:6px 0 10px;}
  .overlay .ttl.ok{color:#3fa84a;} .overlay .ttl.win{color:var(--accent-d);}
  .overlay .eqbig{font-size:clamp(24px,7vw,34px);font-weight:800;margin-bottom:18px;}
  .gamebox{position:relative;width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;}

  .star{position:fixed;pointer-events:none;z-index:80;font-size:26px;}
  @keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>たりない かずは なんでしょう？</h1>
    <p class="subt">あと いくつ あれば、かずが そろうかな？</p>
  </header>

  <!-- メニュー -->
  <div class="screen" id="scMenu">
    <div class="lead">どの かずで あそぶ？</div>
    <div class="grid" id="menuGrid"></div>
  </div>

  <!-- ゲーム -->
  <div class="screen hidden" id="scGame">
    <div class="topbar">
      <button class="btn gray" id="backMenu">← もどる</button>
      <div style="display:flex;gap:8px;">
        <div class="badge q"><span id="qnum">1</span> もんめ</div>
        <div class="badge s">てん <span id="score">0</span></div>
      </div>
    </div>
    <div class="pbar"><div class="pfill" id="pfill" style="width:10%"></div></div>
    <div class="prow"><span>1</span><span id="qtotal">10もん</span></div>

    <div class="gamebox">
      <div class="question">
        <b id="target">3</b> に なるには、あと なんこ たりない？
      </div>

      <div class="framewrap">
        <div id="grid" class="grid5"></div>
        <div id="goalline" class="goalline"><span class="flag">🏁</span></div>
      </div>

      <div class="eq" id="eq">
        <span id="cur">1</span> + <span class="q" id="ans">？</span> = <span id="eqtar">3</span><span class="mark" id="mark"></span>
      </div>

      <div class="numpad" id="numpad"></div>
      <button class="btn confirm hidden" id="confirmBtn">✔ これで よい？</button>
      <button class="btn retry hidden" id="retryBtn">🔄 もう いちど</button>

      <!-- せいかい -->
      <div class="overlay hidden" id="okOverlay">
        <div class="big">🎉</div>
        <div class="ttl ok">せいかい！</div>
        <div class="eqbig" id="okEq"></div>
        <button class="btn" id="continueBtn">つぎへ すすむ →</button>
      </div>
      <!-- ぜんもん おわり -->
      <div class="overlay hidden" id="winOverlay">
        <div class="big">🏆</div>
        <div class="ttl win">おめでとう！</div>
        <div style="font-size:clamp(18px,5vw,24px);font-weight:700;margin-bottom:6px;">ぜんぶ できたね！</div>
        <div class="eqbig">てん： <span id="finalScore">0</span></div>
        <button class="btn" id="toMenuWin">メニューに もどる</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var scMenu=$('scMenu'), scGame=$('scGame');
  var gridEl=$('grid'), goalEl=$('goalline'), numpad=$('numpad');
  var TOTAL=10;
  var target=3, current=1, score=0, qnum=1, answered=false, locked=false, selected=null;

  /* ---- サウンド ---- */
  var actx=null;
  function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
  function beep(f,d,type,when,vol){ var c=ac(); if(!c)return; var t=c.currentTime+(when||0);
    var o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.16,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+d+0.02); }
  function sOK(){ beep(660,0.14,'sine',0,0.2); beep(990,0.22,'sine',0.1,0.2); }
  function sNG(){ beep(200,0.22,'sawtooth',0,0.14); }
  function sPop(){ beep(720,0.08,'sine',0,0.14); }
  function sWin(){ [523,659,784,1047].forEach(function(f,i){ beep(f,0.3,'triangle',i*0.12,0.2); }); }

  /* ---- メニュー ---- */
  function buildMenu(){
    var grid=$('menuGrid'); grid.innerHTML='';
    for(var n=1;n<=10;n++){
      var d=document.createElement('div'); d.className='tile n'+n; d.dataset.t=n;
      d.innerHTML='<div class="tnum">'+n+'</div><div class="tcnt">10もん</div>';
      grid.appendChild(d);
    }
    grid.querySelectorAll('.tile').forEach(function(t){
      t.addEventListener('click',function(){ ac(); startGame(parseInt(this.dataset.t,10)); });
    });
  }
  function show(el){ [scMenu,scGame].forEach(function(s){s.classList.add('hidden');}); el.classList.remove('hidden'); }

  /* ---- ゲーム ---- */
  function startGame(t){
    target=t; score=0; qnum=1;
    $('score').textContent='0'; $('qtotal').textContent=TOTAL+'もん';
    $('target').textContent=t; $('eqtar').textContent=t;
    buildNumpad();
    show(scGame);
    newQuestion();
  }
  function buildNumpad(){
    // いつも 0〜9（9の ボタンは つねに ある）
    numpad.innerHTML='';
    for(var i=0;i<=9;i++){
      var b=document.createElement('button'); b.className='nbtn'; b.dataset.v=i; b.textContent=i;
      b.addEventListener('click',function(){ ac(); pickNumber(parseInt(this.dataset.v,10)); });
      numpad.appendChild(b);
    }
  }
  function newQuestion(){
    answered=false; locked=false; selected=null;
    numpad.classList.remove('lock');
    $('retryBtn').classList.add('hidden');
    $('confirmBtn').classList.add('hidden');
    // 1 〜 target-1 の げんざいの かず
    current = 1 + Math.floor(Math.random()*(target-1 || 1));
    if(current>=target) current=target-1;
    if(current<1) current=1;
    $('qnum').textContent=qnum;
    $('pfill').style.width=(qnum/TOTAL*100)+'%';
    $('cur').textContent=current;
    var a=$('ans'); a.textContent='？'; a.className='q';
    clearMark();
    numpad.querySelectorAll('.nbtn').forEach(function(b){ b.classList.remove('used','bad','sel'); });
    renderDots(current, 0);
  }
  // まるを 5こずつ 一続きで ならべる。0..cur-1=あか、そのつぎ=あお。
  // target を こえた ぶんは ゴールせんを こえて オレンジで はみ出す。
  function renderDots(cur, blue){
    if(blue<0) blue=0;
    gridEl.innerHTML='';
    var total=Math.max(target, cur+blue);
    for(var idx=0;idx<total;idx++){
      var d=document.createElement('div'); d.className='cell';
      if(idx<cur){ d.classList.add('on'); }
      else if(idx<cur+blue){
        d.classList.add(idx<target ? 'add' : 'over');
        d.style.animationDelay=((idx-cur)*0.08)+'s';
      }
      gridEl.appendChild(d);
    }
    positionGoal();
  }
  // ゴールせんを target の いちに おく
  function positionGoal(){
    var cells=gridEl.children;
    if(cells.length<target || target<1){ goalEl.style.display='none'; return; }
    var b=cells[target-1];
    goalEl.style.display='block';
    goalEl.style.left=(b.offsetLeft+b.offsetWidth+3)+'px';
    goalEl.style.top=(b.offsetTop-6)+'px';
    goalEl.style.height=(b.offsetHeight+12)+'px';
  }

  // すうじを えらぶ（まだ はんてい しない＝ふりかえられる）
  function pickNumber(v){
    if(answered || locked) return;
    selected=v;
    numpad.querySelectorAll('.nbtn').forEach(function(b){ b.classList.toggle('sel', +b.dataset.v===v); });
    var a=$('ans'); a.textContent=v; a.className='sel';   // かりの こたえ
    clearMark();
    renderDots(current, v);                               // プレビュー（おおいと ゴールせんを こえる）
    sPop();
    $('confirmBtn').classList.remove('hidden');           // 「これで よい？」を みせる
  }
  // 「これで よい？」で はんてい
  function judge(){
    if(selected==null || answered || locked) return;
    var v=selected, correct=target-current, ans=$('ans'), eq=$('eq');
    $('confirmBtn').classList.add('hidden');
    if(v===correct){
      answered=true;
      ans.textContent=v; ans.className='ok';
      score+=10; $('score').textContent=score;
      renderDots(current, correct);
      sOK(); celebrate();
      $('okEq').innerHTML=current+' + <span style="color:#3fa84a">'+correct+'</span> = '+target;
      setTimeout(function(){ $('okOverlay').classList.remove('hidden'); }, correct*120+500);
    } else {
      // まちがい：じどうで もどさず、「もう いちど」を おすまで とめる
      locked=true;
      ans.textContent=v; ans.className='ng';
      renderDots(current, v);
      eq.classList.add('shake'); sNG(); showX();
      var b=numpad.querySelector('.nbtn[data-v="'+v+'"]'); if(b){ b.classList.remove('sel'); b.classList.add('bad'); }
      setTimeout(function(){ eq.classList.remove('shake'); },500);
      numpad.classList.add('lock');
      $('retryBtn').classList.remove('hidden');
    }
  }
  function nextQuestion(){
    $('okOverlay').classList.add('hidden');
    if(qnum<TOTAL){ qnum++; newQuestion(); }
    else { $('finalScore').textContent=score; $('winOverlay').classList.remove('hidden'); sWin(); confetti(); }
  }

  /* ---- エフェクト ---- */
  function showX(){
    var m=$('mark'); m.textContent='✕'; m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
  }
  function clearMark(){ var m=$('mark'); m.classList.remove('show'); m.textContent=''; }
  function celebrate(){
    var ch=['🎉','⭐','✨','🌟','🎊']; var box=$('scGame').getBoundingClientRect();
    for(var i=0;i<10;i++){ var e=document.createElement('div'); e.className='star'; e.textContent=ch[Math.floor(Math.random()*ch.length)];
      e.style.left=(box.left+Math.random()*box.width)+'px'; e.style.top=(box.top+40+Math.random()*120)+'px';
      e.style.animation='fall '+(1+Math.random()*0.6)+'s ease-in forwards';
      document.body.appendChild(e); setTimeout(function(n){return function(){n.remove();};}(e),1700); }
  }
  function confetti(){
    var ch=['⭐','✨','🎊','🌟','💫','🎉'];
    for(var i=0;i<30;i++){ (function(d){ setTimeout(function(){
      var s=document.createElement('div'); s.className='star'; s.textContent=ch[Math.floor(Math.random()*ch.length)];
      s.style.left=(Math.random()*100)+'%'; s.style.top='-40px'; s.style.fontSize=(18+Math.random()*22)+'px';
      s.style.animation='fall '+(2+Math.random()*1.5)+'s ease-in forwards';
      document.body.appendChild(s); setTimeout(function(){s.remove();},3600);
    },d); })(i*45); }
  }

  /* ---- ボタン ---- */
  $('confirmBtn').addEventListener('click',function(){ ac(); judge(); });
  $('retryBtn').addEventListener('click',function(){
    ac();
    locked=false; selected=null;
    $('retryBtn').classList.add('hidden');
    $('confirmBtn').classList.add('hidden');
    numpad.classList.remove('lock');
    numpad.querySelectorAll('.nbtn').forEach(function(b){ b.classList.remove('bad','used','sel'); });
    var a=$('ans'); a.textContent='？'; a.className='q';
    clearMark();
    renderDots(current, 0);            // おなじ もんだいを もういちど（えらびなおし）
  });
  $('continueBtn').addEventListener('click',function(){ ac(); nextQuestion(); });
  $('backMenu').addEventListener('click',function(){ ac(); show(scMenu); });
  $('toMenuWin').addEventListener('click',function(){ ac(); $('winOverlay').classList.add('hidden'); show(scMenu); });
  window.addEventListener('resize',positionGoal);

  buildMenu();
  show(scMenu);
})();
</script>
</body>
</html>
